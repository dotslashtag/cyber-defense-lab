name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-build:
    name: Site build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  detections:
    name: Detection tests (Sigma + Wazuh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-detections.txt
      - run: pip install -r requirements-detections.txt -e tools/evtx-hunter
      - run: pytest detections/tests -v

  evtx-hunter:
    name: EVTX Hunter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/evtx-hunter/pyproject.toml
      - run: pip install -e "tools/evtx-hunter[test]"
      - name: Sample data is reproducible
        run: |
          python tools/evtx-hunter/samples/make_sample.py
          git diff --exit-code tools/evtx-hunter/samples/op002-style-archives.json
      - run: pytest tools/evtx-hunter/tests -v
      - name: Smoke-run the CLI on the sample
        run: |
          evtx-hunter hunt tools/evtx-hunter/samples/op002-style-archives.json -f json -o /tmp/report.json
          python -c "import json; n=json.load(open('/tmp/report.json'))['summary']['findings']; assert n == 6, n"
