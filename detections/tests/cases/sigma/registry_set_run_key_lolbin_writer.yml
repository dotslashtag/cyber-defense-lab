    event:
      EventID: 13
      Image: 'C:\Users\labuser\AppData\Local\Microsoft\OneDrive\OneDrive.exe'
      TargetObject: 'HKU\S-1-5-21-1111111111-2222222222-3333333333-1105\Software\Microsoft\Windows\CurrentVersion\Run\OneDrive'
      Details: '"C:\Users\labuser\AppData\Local\Microsoft\OneDrive\OneDrive.exe" /background'
  - description: PowerShell writing an unrelated key
    event:
      EventID: 13
      Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      TargetObject: 'HKU\S-1-5-21-1111111111-2222222222-3333333333-1105\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideFileExt'
