    event:
      win:
        system:
          eventID: '4740'
        eventdata:
          targetUserName: 'WIN11-OPS01$'
  - description: A failed logon (4625) is not a lockout
    event:
      win:
        system:
          eventID: '4625'
        eventdata:
          targetUserName: 'labuser'
