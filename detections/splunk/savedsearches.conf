# Cyber Defense Lab - Splunk scheduled correlation searches (app: search)
# All alerts are investigation-only: they add to Triggered Alerts and take no
# automated action. The `search` value is the matching .spl file in this folder.

[SOC - Clustered Discovery Activity]
description = Intent-based: >=4 distinct discovery command categories from one agent in ~10 min, any spawning process. Closes OP-002 2b. Investigation-only.
search = <contents of soc_clustered_discovery_activity.spl>
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = agent_name
alert.suppress.period = 30m

[SOC - Workstation-to-Workstation Lateral Auth]
description = Workstation authenticating (4624 Type 3/10) to a peer workstation. Closes OP-003 3a; complements zone-bound Wazuh rule 99920. Investigation-only.
search = <contents of soc_workstation_to_workstation_lateral_auth.spl>
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = agent_name,srcip,targetUser
alert.suppress.period = 60m

[SOC - Run/RunOnce Key Modified]
description = v2 (2026-10-13): exact Run-style keys (RunMRU/Uninstall excluded), per-host dedup, agent_name in output. Run/RunOnce persistence write by a shell, script host or LOLBin (writer-agnostic name; source_image shows the actual writer). Replaces the misnamed "SOC - Suspicious Script Host Modifies Run Key" (kept disabled for rollback). OP-004 D3. Investigation-only.
search = <contents of soc_run_runonce_key_modified.spl>
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.expires = 24h
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 1
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 15m
