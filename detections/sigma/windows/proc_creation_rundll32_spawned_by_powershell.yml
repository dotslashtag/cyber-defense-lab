title: Rundll32 Spawned By PowerShell
id: 66c4add3-8deb-4078-87f8-4b7a8a545398
status: test
description: |
  rundll32.exe launched directly by PowerShell. Attackers use rundll32 to run
  malicious DLLs under a signed Microsoft binary. Sigma version of lab Wazuh rule
  510143 (PB-009).
author: dotslashtag
date: 2026-10-08
tags:
  - attack.defense-evasion
  - attack.t1218.011
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    ParentImage|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
falsepositives:
  - Software installers and admin scripts that call rundll32 from PowerShell
level: high
