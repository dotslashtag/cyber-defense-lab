title: Workstation-To-Workstation Network Logon
id: 15a7687e-950f-422b-9922-a946500cf3bf
status: test
description: |
  A workstation received a network (type 3) or RDP (type 10) logon from another
  workstation. Users rarely authenticate from one desktop to another, but attackers
  moving laterally with valid credentials do. Built after OP-003, where an
  intra-zone hop raised no alert. Sigma version of the lab Splunk search
  "SOC - Workstation-to-Workstation Lateral Auth" (OP-004 D2).

  The workstation hostnames and IP addresses below are lab values; replace them
  with your own inventory. A host logging on to itself through its own IP is not
  lateral movement: Sigma cannot compare two fields, so filter_self_logon pairs each
  workstation with its own address (the Splunk version compares them directly).
  Added 2026-10-13 after EVTX Hunter flagged WIN11-OPS01 -> 10.10.2.9 on real logs.
author: dotslashtag
date: 2026-10-08
modified: 2026-10-13
tags:
  - attack.lateral-movement
  - attack.t1021.002
  - attack.t1550.002
  - attack.defense-evasion
  - attack.t1078
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4624
    LogonType:
      - 3
      - 10
  selection_target_workstation:
    Computer:
      - 'Win10.soc.lab'
      - 'WIN11-OPS01.soc.lab'
      - 'WIN11-PB026.soc.lab'
  selection_source_workstation:
    IpAddress:
      - '10.10.2.4'
      - '10.10.2.9'
      - '10.10.2.8'
  filter_loopback:
    IpAddress:
      - '127.0.0.1'
      - '::1'
      - '-'
  filter_self_logon:
    - Computer: 'Win10.soc.lab'
      IpAddress: '10.10.2.4'
    - Computer: 'WIN11-OPS01.soc.lab'
      IpAddress: '10.10.2.9'
    - Computer: 'WIN11-PB026.soc.lab'
      IpAddress: '10.10.2.8'
  condition: all of selection_* and not 1 of filter_*
fields:
  - Computer
  - IpAddress
  - TargetUserName
  - LogonType
falsepositives:
  - IT staff remoting between desktops; peer-to-peer file sharing
level: medium
