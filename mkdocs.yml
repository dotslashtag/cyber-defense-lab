site_name: Cyber Defense Lab
site_description: Home SOC lab portfolio — detection engineering, purple-team operations, SOAR, and SOC analyzer tools.
site_author: dotslashtag
site_url: https://dotslashtag.github.io/cyber-defense-lab/
repo_url: https://github.com/dotslashtag/cyber-defense-lab
repo_name: dotslashtag/cyber-defense-lab
edit_uri: ""
docs_dir: docs
site_dir: _site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - navigation.indexes
    - content.code.copy
    - search.highlight
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:
      zoomable: true
      skip_classes:
        - skip-lightbox

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dotslashtag
      name: GitHub
  generator: false

copyright: Built and operated by dotslashtag · Lab content is from an isolated, authorized home lab

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - The Lab:
      - lab/index.md
      - Architecture: lab/architecture.md
  - Operations:
      - operations/index.md
      - Results: operations/results.md
  - Detections:
      - detections/index.md
  - Tools:
      - tools/index.md
      - Phishing Analyzer: tools/phish-analyzer.md
      - EVTX Hunter: tools/evtx-hunter.md
      - Beacon Hunter: tools/beacon-hunter.md
  - Casebook:
      - casebook/index.md
      - "CASE-OP001: Commodity intrusion": casebook/op-001-commodity-intrusion.md
      - "CASE-OP002: Quiet intrusion": casebook/op-002-stealth-tradecraft.md
      - "CASE-OP003: Lateral movement": casebook/op-003-lateral-movement.md
  - Roadmap: roadmap.md
  - About: about.md
