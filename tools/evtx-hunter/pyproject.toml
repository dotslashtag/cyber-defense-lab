[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evtx-hunter"
version = "0.1.0"
description = "Triage Windows event logs (EVTX or Wazuh archives) with Sigma rules, process trees and a timeline report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pySigma==1.5.1",
  "python-evtx==0.8.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pysigma-backend-splunk==2.1.0"]

[project.scripts]
evtx-hunter = "evtx_hunter.cli:main"

[tool.setuptools]
packages = ["evtx_hunter"]
